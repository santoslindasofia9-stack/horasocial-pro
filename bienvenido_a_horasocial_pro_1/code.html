<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>HORASOCIAL PRO - Bienvenido</title>
<!-- Tailwind CSS (compiled locally) -->
<link rel="stylesheet" href="/bienvenido_a_horasocial_pro_1/style.css">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts: Plus Jakarta Sans & Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        
        .bg-pattern {
            background-color: #ffffff;
            position: relative;
        }

        .floating-icon {
            position: absolute;
            opacity: 0.03;
            user-select: none;
            pointer-events: none;
        }

        .btn-glow:active {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Flow field: continuous band of fine lines, centered in the middle third */
        .flow-field {
            position: absolute;
            left: 0;
            right: 0;
            top: 30%;
            height: 40%;
            z-index: 0;
            pointer-events: none;
            overflow: visible;
        }
        .flow-field svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .flow-field .wf-l {
            fill: none;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
            stroke-width: 0.9;
        }
        .content-layer {
            position: relative;
            z-index: 1;
        }
        @keyframes flow-drift {
            0%, 100% { transform: translate(0px, 0px); }
            20% { transform: translate(9px, -16px); }
            45% { transform: translate(19px, -6px); }
            70% { transform: translate(11px, 6px); }
        }
        .wiggle {
            animation: flow-drift 38s ease-in-out infinite;
            will-change: transform;
        }

        /* Decorative sparkle layer: subtle twinkling dots behind the content */
        .sparkle-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 4px rgba(148, 178, 214, 0.45);
            /* Delay/duration/max-opacity come from per-element --d / --dur / --so */
            animation: sparkle-twinkle var(--dur, 4s) ease-in-out var(--d, 0s) infinite;
            will-change: opacity;
        }
        /* Occasional four-point star glint */
        .sparkle.glint {
            width: 9px;
            height: 9px;
            background: #ffffff;
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            --so: 0.72;
        }
        /* Literal "✨" glyph sparkles: pastel text twinkles, no dot geometry */
        .sparkle.glyph {
            border-radius: 0;
            box-shadow: none;
            line-height: 1;
            --so: 0.55;
        }
        @keyframes sparkle-twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: var(--so, 0.5); }
        }
        @media (prefers-reduced-motion: reduce) {
            .sparkle, .sparkle.glint { animation: none; opacity: 0.35; }
        }

        /* Pink pastel waves — two pink copies sit over the dominant blue field:
           1) .flow-pink-static — always-on pastel pink revealed across diagonal
              "tramos" via a static linear-gradient mask; no mouse movement needed.
           2) .flow-pink — cursor-reactive layer: radial mask follows --mx/--my
              (written by a single rAF tick), parked off-canvas until the pointer moves. */
        .flow-field.flow-pink-static {
            -webkit-mask-image: linear-gradient(115deg, transparent 4%, #000 16%, transparent 30%, #000 44%, transparent 58%, #000 72%, transparent 86%);
            mask-image: linear-gradient(115deg, transparent 4%, #000 16%, transparent 30%, #000 44%, transparent 58%, #000 72%, transparent 86%);
            -webkit-mask-clip: no-clip;
            mask-clip: no-clip;
        }
        .flow-field.flow-pink-static svg { opacity: 0.58; }
        .flow-field.flow-pink {
            -webkit-mask-image: radial-gradient(circle 320px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
            mask-image: radial-gradient(circle 320px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
            -webkit-mask-clip: no-clip;
            mask-clip: no-clip;
        }
        .flow-field.flow-pink svg { opacity: 0.68; }

        /* Developer credit: discreet tracked-out line under the copyright */
        .dev-credit {
            color: rgba(170, 119, 28, 0.85);
            letter-spacing: 0.08em;
        }

        /* Golden primary action */
        .btn-gold {
            background: linear-gradient(135deg, #D4AF37, #F3E5AB, #AA771C);
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(170, 119, 28, 0.55);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            text-shadow: 0 1px 2px rgba(122, 84, 6, 0.55);
        }
        .btn-gold:hover {
            filter: brightness(1.05);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.55);
        }
        .btn-gold:active {
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.45);
        }
        /* Keep the hover accent overlay subtle so it never washes out the gold */
        .btn-gold.group:hover .bg-secondary-container { opacity: 0.07; }
        /* Icon keeps the white label colour */
        .btn-gold .material-symbols-outlined { color: #ffffff; }
    </style>
</head>

<!-- Micro-interaction Script -->
<script>
        function handleNavigation() {
            // Visual feedback before navigating to the next screen
            // (scoped by id: the first <button> in the DOM is not necessarily this one)
            const btn = document.getElementById('btnSiguiente');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            }

            setTimeout(() => {
                // Relative file path when opened from disk, server route otherwise
                const nextFile = '../selecci_n_de_rol_distribuci_n_expandida_vertical/code.html';
                const nextRoute = '/seleccion-rol';
                window.location.href = window.location.protocol === 'file:'
                    ? nextFile
                    : nextRoute;
            }, 800);
        }

        // Add a parallax-like effect to watermarks on mouse move (Desktop Only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const icons = document.querySelectorAll('.floating-icon');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                icons.forEach((icon, index) => {
                    const speed = (index + 1) * 10;
                    const xOffset = (x - 0.5) * speed;
                    const yOffset = (y - 0.5) * speed;
                    icon.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
                });
            });
        }

        // Sparkle field: stratified twinkling dots covering the full viewport
        // (decorative only). The viewport is divided into an even grid of cells and
        // exactly one sparkle is placed per cell (centre + jitter confined to the
        // cell), so the distribution never clumps and reaches top to bottom.
        (function buildSparkles() {
            const layer = document.querySelector('.sparkle-layer');
            if (!layer) return;

            const COLS = 8;             // grid columns
            const ROWS = 5;             // grid rows → 40 cells
            const COUNT = COLS * ROWS;  // 40 elements: 35 dots + 5 "✨" glyphs
            const GLYPH_CELLS = [5, 14, 22, 30, 37]; // cells holding a "✨" glyph (one per row)
            const GLINT_EVERY = 7;      // every 7th non-glyph cell is a star glint (~5)
            let seed = 20261017;        // fixed seed: identical layout on every load

            function rand() {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            }

            // Dot palette, target weights: white 35%, pastel pink 25%, gold 20%, sky 20%
            function pickColor(r) {
                if (r < 0.35) return '#ffffff';
                if (r < 0.60) return '#FFD1DC';
                if (r < 0.80) return '#E6C687';
                return '#cde9ff';
            }
            // Glyph palettes stay pastel (never pure white, it would vanish on white)
            function pickGlyphColor(r) {
                if (r < 0.40) return '#FFD1DC';
                if (r < 0.75) return '#E6C687';
                return '#cde9ff';
            }

            const cellW = 100 / COLS;
            const cellH = 100 / ROWS;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < COUNT; i++) {
                const col = i % COLS;
                const row = Math.floor(i / COLS);
                const dot = document.createElement('span');
                const isGlyph = GLYPH_CELLS.indexOf(i) !== -1;
                const isGlint = !isGlyph && (i % GLINT_EVERY) === 3;
                dot.className = isGlyph ? 'sparkle glyph' : (isGlint ? 'sparkle glint' : 'sparkle');

                // Stratified placement: cell centre + jitter that stays inside the cell
                const left = (col + 0.5) * cellW + (rand() - 0.5) * cellW * 0.7;
                const top = (row + 0.5) * cellH + (rand() - 0.5) * cellH * 0.7;
                dot.style.left = Math.min(97, Math.max(2, left)).toFixed(2) + '%';
                dot.style.top = Math.min(97, Math.max(2, top)).toFixed(2) + '%';

                if (isGlyph) {
                    dot.textContent = '✨';
                    dot.style.fontSize = (10 + rand() * 4).toFixed(1) + 'px'; // 10–14px
                    dot.style.color = pickGlyphColor(rand());
                    dot.style.setProperty('--so', (0.45 + rand() * 0.1).toFixed(2)); // capped at 0.55
                } else if (isGlint) {
                    dot.style.setProperty('--so', '0.72');
                } else {
                    let size = (2 + rand() * 3).toFixed(1); // 2–5 px
                    if (i % 8 === 0) { size = '5.0'; } // guarantee a few full-size 5px dots
                    dot.style.width = size + 'px';
                    dot.style.height = size + 'px';
                    dot.style.background = pickColor(rand());
                    dot.style.setProperty('--so', (0.3 + rand() * 0.38).toFixed(2)); // capped at 0.68
                }
                dot.style.setProperty('--dur', (3.5 + rand() * 3).toFixed(2) + 's');
                dot.style.setProperty('--d', (-rand() * 6).toFixed(2) + 's');
                frag.appendChild(dot);
            }
            layer.appendChild(frag);
        })();

        // Pink pastel tint: reveal the duplicate (pink) wave set near the cursor.
        // --mx/--my are consumed by the CSS mask on .flow-pink; coordinates are
        // relative to the .flow-field bounding rect and applied inside a single
        // rAF tick, so mousemove never causes layout thrash.
        (function pinkTint() {
            const field = document.querySelector('.flow-field');
            const pink = document.querySelector('.flow-pink');
            if (!field || !pink) return;

            let rect = field.getBoundingClientRect();
            let lastX = -400;
            let lastY = -400;
            let queued = false;

            function apply() {
                queued = false;
                pink.style.setProperty('--mx', lastX + 'px');
                pink.style.setProperty('--my', lastY + 'px');
            }

            document.addEventListener('mousemove', (e) => {
                // Both layers carry the same .wiggle translation, so the transformed
                // rect maps the cursor straight into the mask's local coordinate space.
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
                if (!queued) {
                    queued = true;
                    requestAnimationFrame(apply);
                }
            }, { passive: true });

            window.addEventListener('resize', () => { rect = field.getBoundingClientRect(); });
        })();
    </script>
