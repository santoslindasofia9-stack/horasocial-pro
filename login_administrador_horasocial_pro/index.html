<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HORASOCIAL PRO - Iniciar Sesión: administradores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --royal-50: #EEF2FF;
      --royal-100: #E0E7FF;
      --royal-200: #C7D2FE;
      --royal-300: #A5B4FC;
      --royal-400: #818CF8;
      --royal-500: #6366F1;
      --royal-600: #4F46E5;
      --royal-700: #4338CA;
      --royal-800: #3730A3;
      --royal-900: #312E81;
      --ink: #1E1B4B;
      --surface: #FFFFFF;
      --muted: #45464D;
      --muted-soft: #6B7280;
      --line: #C9CCE8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    /* Background wave field — same as welcome / role selection */
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
    .wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer { position: relative; z-index: 1; }

    /* Header */
    .site-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
    }
    .site-header .logo {
      height: 160px;
      width: auto;
      object-fit: contain;
      border: 1.5px solid rgba(30, 27, 75, 0.75);
      border-radius: 14px;
      padding: 8px;
      background: #fff;
      margin-bottom: 24px;
    }
    .slogan {
      text-align: center;
      padding: 0 16px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slogan .line-1 { color: var(--ink); }
    .slogan .line-2 { color: var(--royal-500); }

    /* Login card */
    .login-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid rgba(201, 204, 232, 0.9);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 27, 75, 0.08);
      padding: 32px;
      text-align: center;
    }
    .login-card h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .login-card h1 .rol {
      color: var(--royal-500);
    }
    .login-card .subtitle {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted-soft);
      margin-bottom: 24px;
    }
    .field {
      margin-bottom: 20px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--muted-soft);
      font-size: 20px;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 46px;
      font-size: 15px;
      font-family: "Inter", sans-serif;
      color: var(--ink);
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .input-wrap input::placeholder { color: rgba(107, 114, 128, 0.7); }
    .input-wrap input:focus {
      border-color: var(--royal-500);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    .input-wrap .eye {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-soft);
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .input-wrap .eye:hover { color: var(--royal-500); }
    .btn-ingresar {
      width: 100%;
      padding: 14px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, var(--royal-500), var(--royal-700));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
    }
    .btn-ingresar:hover { background: linear-gradient(135deg, var(--royal-400), var(--royal-600)); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.45); }
    .btn-ingresar:active { transform: scale(0.98); }
    .forgot {
      display: block;
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--royal-600);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 9px 18px;
      font-family: "Inter", sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--royal-700);
      background: linear-gradient(180deg, var(--royal-50), var(--royal-100));
      border: 1px solid var(--royal-200);
      border-radius: 999px;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease;
    }
    .btn-back:hover { background: linear-gradient(180deg, var(--royal-100), var(--royal-200)); border-color: var(--royal-300); }
    .btn-back .material-symbols-outlined { font-size: 16px; }

    /* Footer */
    .site-footer {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .site-footer .copy {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-soft);
    }
    .site-footer nav { display: flex; gap: 20px; }
    .site-footer nav a {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-soft);
      text-decoration: none;
    }
    .site-footer nav a:hover { color: var(--royal-500); }

    @media (max-width: 640px) {
      .site-header { padding-top: 20px; }
      .site-header .logo { height: 120px; }
      .login-card { padding: 24px 18px; }
      .site-footer { justify-content: center; }
    }
</style>
</head>

<!-- Login card: administradores -->
<main class="login-wrap">
<div class="login-card">
<h1>Iniciar Sesión: <span class="rol">administradores</span></h1>
<p class="subtitle">Gestión central de HORASOCIAL PRO · Colegio Alfredo Correa</p>

<form id="loginForm" action="/api/login-administrador" method="post" autocomplete="on">
<div class="field">
<label for="username">Usuario</label>
<div class="input-wrap">
<span class="material-symbols-outlined icon">person</span>
<input id="username" name="username" type="text" placeholder="Usuario" autocomplete="username" required/>
</div>
</div>

<div class="field">
<label for="password">Contraseña</label>
<div class="input-wrap">
<span class="material-symbols-outlined icon">lock</span>
<input id="password" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required/>
<button class="eye" type="button" onclick="togglePassword()" aria-label="Mostrar u ocultar contraseña">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>

<button class="btn-ingresar" type="submit">INGRESAR</button>
