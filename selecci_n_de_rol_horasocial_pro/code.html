<!DOCTYPE html><html class="light" lang="es"><head>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .blur-blob {
      filter: blur(100px);
      z-index: -1;
    }
    .institutional-dark { color: #0F172A; }
    .bright-sky { color: #38BDF8; }
    .bg-institutional-dark { background-color: #0F172A; }
    .bg-bright-sky { background-color: #38BDF8; }
    .border-bright-sky { border-color: #38BDF8; }
    .border-institutional-dark { border-color: #0F172A; }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-x-hidden min-h-screen relative">
<!-- Dynamic Background Blurs -->
<div class="fixed top-0 left-0 w-full h-full -z-10 bg-gradient-to-br from-[#FCFCFA] via-surface to-[#E0F2FE]">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-secondary/15 blur-blob"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[40%] h-[40%] rounded-full bg-error/10 blur-blob"></div>
</div>
<!-- Shared Component: TopAppBar -->
<header class="docked full-width top-0 bg-surface dark:bg-on-surface flex justify-center items-center w-full px-margin-mobile md:px-margin-desktop py-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="school">school</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">HORASOCIAL PRO</h1>
</div>
</header>
<main class="flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl min-h-[calc(100vh-160px)]">
<!-- Branding Section -->
<section class="text-center mb-xl animate-fade-in-up">
<div class="mb-md flex justify-center">
<img alt="HORASOCIAL PRO Logo" class="h-32 md:h-40 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDm3qiUhVnCqSW7_IAe_xBwdgDdkIInzmwRaRRKDC0IgX-r_hwJT26jMLwRtAeOA899-nfz10321eOYWEsGQNbL4ZzTcMD19Deblw0_GcFAnkMKdnZ39jCVbdgRYlW7sP0jQ3dMOrpuzKVBsMDABAeQ6KKrhOM1qJvIJN7siwq6Td1hi0WwrUBWvsN7Z627B8ssyZA7Xru5DfJ5DVIiY3DHbaUastvICb-T0ZMh-AGHQb8UPWUJbcGLB5RZWnmpA-9xZb7qyOQJuoLo">
</div>
<p class="font-headline-sm text-headline-sm md:text-headline-md flex flex-col md:flex-row gap-2 md:gap-x-1 justify-center items-center">
<span class="institutional-dark font-bold">Formando líderes.</span>
<span class="bright-sky font-bold">Trackeando tu impacto.</span>
</p>
</section>
<!-- Role Selection Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-gutter w-full max-w-5xl">
<!-- Card 1: Estudiante -->
<button class="group relative bg-surface-container-lowest/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 hover:-translate-y-2 hover:shadow-xl hover:border-bright-sky flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-md transition-colors duration-300 group-hover:bg-bright-sky">
<span class="material-symbols-outlined text-white text-3xl transition-transform duration-300 group-hover:scale-110" data-icon="school">school</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface-variant font-bold transition-colors duration-300 group-hover:text-primary">Estudiante</h3>
<p class="mt-sm font-label-md text-label-md text-outline">Registra tus horas y gestiona proyectos sociales.</p>
<!-- Card Motif -->
<div class="absolute bottom-2 right-2 opacity-[0.03] pointer-events-none">
<span class="material-symbols-outlined text-4xl" data-icon="settings">settings</span>
</div>
</button>
<!-- Card 2: Profesor -->
<button class="group relative bg-surface-container-lowest/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 hover:-translate-y-2 hover:shadow-xl hover:border-institutional-dark flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-md transition-colors duration-300 group-hover:bg-[#0F172A]">
<span class="material-symbols-outlined text-on-surface-variant text-3xl transition-transform duration-300 group-hover:text-white" data-icon="group">group</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface-variant font-bold transition-colors duration-300 group-hover:text-primary">Profesor</h3>
<p class="mt-sm font-label-md text-label-md text-outline">Supervisa el avance de tus estudiantes y aprueba horas.</p>
<div class="absolute bottom-2 right-2 opacity-[0.03] pointer-events-none">
<span class="material-symbols-outlined text-4xl" data-icon="settings">settings</span>
</div>
</button>
<!-- Card 3: Administrador -->
<button class="group relative bg-surface-container-lowest/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 hover:-translate-y-2 hover:shadow-xl hover:ring-2 hover:ring-institutional-dark flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-md transition-all duration-300">
<span class="material-symbols-outlined text-white text-3xl transition-transform duration-300 group-hover:rotate-12" data-icon="shield_person">shield_person</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface-variant font-bold transition-colors duration-300 group-hover:text-primary">Administrador</h3>
<p class="mt-sm font-label-md text-label-md text-outline">Gestiona instituciones, programas y reportes globales.</p>
<div class="absolute bottom-2 right-2 opacity-[0.03] pointer-events-none">
<span class="material-symbols-outlined text-4xl" data-icon="settings">settings</span>
</div>
</button>
</section>
<!-- Context Support Message -->
<div class="mt-xl text-center">
<p class="font-label-md text-label-md text-outline">¿Necesitas ayuda? <a class="text-secondary font-semibold hover:underline transition-all" href="#">Consulta nuestra guía de acceso</a></p>
</div>
</main>
<!-- Shared Component: Footer -->
<footer class="full-width bottom-0 bg-transparent flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-lg text-center">
<div class="mb-md md:mb-0">
<span class="font-label-md text-label-md font-bold text-on-surface">HORASOCIAL PRO</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 HORASOCIAL PRO: Gestión de Servicio Social Escolar</p>
</div>
<nav class="flex gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Términos</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacidad</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contacto</a>
</nav>
</footer>
<script>
    // Subtle hover effect logic for cards if needed for more complex interactions
    const cards = document.querySelectorAll('.group');
    cards.forEach(card => {
      card.addEventListener('mouseenter', () => {
        // Active scale logic as per style guidance
        card.classList.add('scale-105');
      });
      card.addEventListener('mouseleave', () => {
        card.classList.remove('scale-105');
      });
      card.addEventListener('mousedown', () => {
        card.classList.add('scale-95');
      });
      card.addEventListener('mouseup', () => {
        card.classList.remove('scale-95');
      });
    });
  </script>
</body></html>
