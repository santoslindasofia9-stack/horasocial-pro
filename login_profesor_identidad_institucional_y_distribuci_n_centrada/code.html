<style>
        .blur-blob {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }
        .blob-1 { background-color: #bae6fd; top: -10%; left: -5%; animation: float 15s infinite alternate; }
        .blob-2 { background-color: #fbcfe8; bottom: -10%; right: -5%; animation: float 20s infinite alternate-reverse; }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 30px); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-bright font-body-md text-on-surface min-h-screen flex flex-col items-center justify-between relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="blur-blob blob-1"></div>
<div class="blur-blob blob-2"></div>
<!-- Hidden Header Anchor (TopAppBar Logic) -->
<header class="fixed top-0 w-full flex justify-center items-center px-gutter py-md bg-transparent z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="school">school</span>
<span class="font-headline-sm text-headline-sm text-primary">Horasocial Pro</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center w-full px-margin-mobile">
<div class="glass-card w-full max-w-[420px] rounded-2xl p-xl shadow-md border border-white/50 animate-in fade-in zoom-in duration-500">
<!-- Branding Identity -->
<div class="flex flex-col items-center mb-xl">
<div class="opacity-30 mb-md">
<span class="material-symbols-outlined !text-[64px]" data-icon="school">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-center">
                    Iniciar Sesión: <span class="text-brand-navy font-bold">Profesor</span>
</h1>
</div>
<!-- Login Form -->
<form action="#" class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-brand-navy px-xs">Correo institucional o usuario</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-brand-navy transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-[48px] pr-md py-md bg-white border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-brand-navy/20 focus:border-brand-navy transition-all outline-none" placeholder="Correo institucional o usuario" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-brand-navy px-xs">Contraseña</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-brand-navy transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[48px] pr-[48px] py-md bg-white border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-brand-navy/20 focus:border-brand-navy transition-all outline-none" id="password-input" placeholder="Contraseña" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-brand-navy transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-brand-navy text-on-primary py-md rounded-lg font-label-md uppercase tracking-wider hover:bg-opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-brand-navy/20 mt-sm" type="submit">
                    Ingresar
                </button>
<!-- Help Link -->
<div class="text-center">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-brand-navy transition-colors inline-block pb-xs border-b border-transparent hover:border-brand-navy" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
</form>
</div>
</main>
<!-- Footer Content (Based on Shared Components) -->
<footer class="w-full flex flex-col md:flex-row justify-between items-center px-margin-desktop py-lg bg-transparent text-on-surface-variant">
<p class="font-label-sm text-label-sm mb-md md:mb-0 opacity-70">
            © 2024 Horasocial Pro. Professional Social Service Management.
        </p>
<nav class="flex gap-lg">
<a class="font-label-sm text-label-sm hover:text-brand-navy transition-colors" href="#">Privacidad</a>
<a class="font-label-sm text-label-sm hover:text-brand-navy transition-colors" href="#">Soporte</a>
<a class="font-label-sm text-label-sm hover:text-brand-navy transition-colors" href="#">Términos</a>
</nav>
</footer>
<script>
        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Suble atmospheric motion tracking the mouse slightly
        document.addEventListener('mousemove', (e) => {
            const blob1 = document.querySelector('.blob-1');
            const blob2 = document.querySelector('.blob-2');
            
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            blob1.style.transform = `translate(${mouseX * 30}px, ${mouseY * 30}px)`;
            blob2.style.transform = `translate(${mouseX * -30}px, ${mouseY * -30}px)`;
        });
    </script>
