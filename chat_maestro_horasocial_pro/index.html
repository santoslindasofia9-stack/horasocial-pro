<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>HORASOCIAL PRO · Chat con Estudiante</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --sky-50:#f0f9ff; --sky-100:#e0f2fe; --sky-200:#bae6fd; --sky-300:#7dd3fc;
    --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7; --sky-700:#0369a1;
    --navy-800:#075985; --navy-900:#0c4a6e; --ink:#0f2f44; --slate:#5b6b7c;
    --card:#ffffff; --card-brd:#e6f0f9; --radius:22px; --maxw:640px;
    --green-500:#22c55e; --amber-500:#f59e0b; --red-400:#f87171; --red-500:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{
    font-family:'Segoe UI',Inter,-apple-system,system-ui,sans-serif;
    color:var(--ink);background:#ffffff;position:relative;overflow-x:hidden;
    min-height:100dvh;
  }

  /* ---------- ondas EXACTAS del dashboard / agenda / registro / mensajes ---------- */
  .flow-field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
  .flow-field svg{width:100%;height:100%;overflow:visible}
  .wf-l{fill:none;stroke-width:0.9;vector-effect:non-scaling-stroke}
  .wiggle{animation:flow-drift 38s ease-in-out infinite;will-change:transform}
  @keyframes flow-drift{0%,100%{transform:translate(0,0)}20%{transform:translate(9px,-16px)}45%{transform:translate(19px,-6px)}70%{transform:translate(11px,6px)}}

  /* ---------- header del chat ---------- */
  .chat-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid #eaf3fb;padding:12px 14px calc(12px + env(safe-area-inset-top))}
  @media (min-width:720px){ .chat-head{padding:14px 22px} }
  .back{width:38px;height:38px;border-radius:12px;background:var(--sky-50);border:1px solid var(--sky-200);
    color:var(--sky-700);display:flex;align-items:center;justify-content:center;cursor:pointer;
    flex:0 0 auto;transition:background .15s,transform .1s;text-decoration:none}
  .back:hover{background:var(--sky-100)}
  .back:active{transform:scale(.92)}
  .back .material-symbols-outlined{font-size:21px}
  .c-ava{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
    color:#fff;font-size:13px;font-weight:800;letter-spacing:.3px;position:relative;
    box-shadow:0 5px 12px rgba(2,132,199,.22)}
  .c-ava .od{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
    background:var(--green-500);border:2px solid #fff}
  .c-ava.off{background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:0 5px 12px rgba(100,116,139,.22)}
  .c-info{flex:1;min-width:0}
  .c-info b{display:block;font-size:14.5px;font-weight:800;color:var(--navy-900);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-info small{display:block;font-size:11px;font-weight:700;color:var(--slate);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-info .online{color:var(--green-500);display:inline-flex;align-items:center;gap:4px}
  .c-info .online i{width:6px;height:6px;border-radius:50%;background:var(--green-500);display:inline-block}
  .c-info .offline{color:#94a3b8;display:inline-flex;align-items:center;gap:4px}
  .mini-ava{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;
    filter:drop-shadow(0 4px 8px rgba(14,165,233,.3));background:var(--navy-900)}
  .mini-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .mini-ava .fb{display:none;position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(135deg,#38bdf8,#0369a1);color:#fff;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;letter-spacing:.3px}

  /* ---------- mensajes ---------- */
  .msgs{max-width:var(--maxw);margin:0 auto;padding:18px 16px 130px;position:relative;z-index:1;
    display:flex;flex-direction:column;gap:9px}
  @media (min-width:720px){ .msgs{max-width:760px} }
  .date-chip{align-self:center;font-size:10px;font-weight:800;color:var(--slate);
    background:rgba(12,74,110,.06);padding:4px 12px;border-radius:999px;margin:4px 0}
  .burbuja{max-width:78%;padding:10px 13px;border-radius:17px;font-size:13.5px;line-height:1.4;
    position:relative;box-shadow:0 4px 12px rgba(3,105,161,.07);animation:popIn .22s ease}
  @keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .burbuja p{word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap}
  .burbuja span{display:block;font-size:9.5px;font-weight:700;margin-top:4px;text-align:right}

  /* boton "eliminar para todos" dentro de la burbuja */
  .burbuja{position:relative}
  .burbuja .btn-del{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
    border:1px solid #fecaca;background:#fff;color:#dc2626;cursor:pointer;display:none;
    align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(220,38,38,.18);z-index:2}
  .burbuja:hover .btn-del,.burbuja:focus-within .btn-del{display:flex}
  .burbuja .btn-del .material-symbols-outlined{font-size:15px}
  @media (hover:none){ .burbuja .btn-del{display:flex} }
  .burbuja.alum{align-self:flex-start;background:#fff;border:1px solid var(--card-brd);
    border-top-left-radius:5px;color:var(--ink)}
  .burbuja.alum span{color:#b6c2cf}
  .burbuja.me{align-self:flex-end;background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
    color:#fff;border-top-right-radius:5px;box-shadow:0 6px 14px rgba(2,132,199,.20)}
  .burbuja.me span{color:rgba(255,255,255,.75)}
  .burbuja.escrib{background:var(--sky-50);border:1px solid var(--sky-200);align-self:flex-start;
    padding:11px 14px}
  .burbuja.escrib .dots{display:inline-flex;gap:4px}
  .burbuja.escrib .dots i{width:6px;height:6px;border-radius:50%;background:var(--sky-500);
    animation:bounce 1.2s infinite}
  .burbuja.escrib .dots i:nth-child(2){animation-delay:.15s}
  .burbuja.escrib .dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  /* ---------- adjuntos dentro de la burbuja ---------- */
  .burbuja .adj-img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:6px;
    cursor:zoom-in;border:1px solid rgba(255,255,255,.35)}
  .burbuja.alum .adj-img{border-color:rgba(12,74,110,.10)}
  .burbuja .adj-doc{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;
    background:rgba(255,255,255,.22);border-radius:10px;padding:7px 9px;margin-bottom:6px}
  .burbuja.alum .adj-doc{background:var(--sky-50)}
  .burbuja .adj-doc .material-symbols-outlined{font-size:20px;flex:0 0 auto}
  .burbuja .adj-doc b{display:block;font-size:11.5px;font-weight:800;max-width:170px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burbuja .adj-doc small{font-size:10px;font-weight:600;opacity:.8}
  .burbuja p:empty{display:none}

  /* ---------- barra de escritura ---------- */
  .inputbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid #eaf3fb;box-shadow:0 -8px 26px rgba(3,105,161,.10);
    padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .inputbar .in{max-width:var(--maxw);margin:0 auto;display:flex;gap:9px;align-items:flex-end}
  @media (min-width:720px){ .inputbar .in{max-width:760px} }
  .inputbar textarea{flex:1;min-width:0;border:1px solid var(--card-brd);border-radius:20px;
    padding:11px 15px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--sky-50);
    outline:none;resize:none;max-height:110px;line-height:1.35}
  .inputbar textarea:focus{border-color:var(--sky-300);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .btn-send{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
    border:0;color:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(2,132,199,.25);
    transition:transform .1s,opacity .15s}
  .btn-send:active{transform:scale(.9)}
  .btn-send:disabled{opacity:.45;cursor:not-allowed}
  .btn-send .material-symbols-outlined{font-size:20px}
  .btn-adj{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:var(--sky-50);border:1px solid var(--card-brd);
    color:var(--sky-700);cursor:pointer;transition:background .15s}
  .btn-adj:hover{background:var(--sky-100, #e0f2fe)}
  .btn-adj .material-symbols-outlined{font-size:20px}

  /* ---------- selector de emojis ---------- */
  .emoji-picker{position:fixed;left:14px;bottom:78px;z-index:40;width:min(300px,calc(100vw - 28px));
    background:#fff;border:1px solid var(--card-brd);border-radius:16px;padding:10px;
    box-shadow:0 14px 34px rgba(3,105,161,.18);display:grid;
    grid-template-columns:repeat(8,1fr);gap:5px;max-height:230px;overflow-y:auto}
  .emoji-picker[hidden]{display:none}
  .emoji-picker button{width:100%;aspect-ratio:1;border:0;border-radius:9px;background:transparent;
    font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s,transform .1s}
  .emoji-picker button:hover{background:var(--sky-50)}
  .emoji-picker button:active{transform:scale(.88)}
  .emoji-picker .emoji-titulo{grid-column:1/-1;font-size:10.5px;font-weight:800;color:var(--slate);
    text-transform:uppercase;letter-spacing:.4px;margin:2px 0 1px;position:sticky;top:-10px;background:#fff;
    padding:3px 0}

  /* tira del adjunto elegido */
  .inputbar .adj-preview,.inputbar .aviso-lenguaje{max-width:var(--maxw);margin:0 auto 8px}
  @media (min-width:720px){ .inputbar .adj-preview,.inputbar .aviso-lenguaje{max-width:760px} }
  .adj-preview{display:flex;align-items:center;gap:9px;background:var(--sky-50);
    border:1px solid var(--sky-200);border-radius:14px;padding:7px 10px}
  .adj-preview[hidden]{display:none}
  .adj-preview img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:0 0 auto}
  .adj-preview img[hidden]{display:none}
  .adj-preview .adj-ico{font-size:22px;color:var(--sky-600);flex:0 0 auto}
  .adj-info{flex:1;min-width:0}
  .adj-info b{display:block;font-size:12px;font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adj-info small{font-size:10.5px;font-weight:600;color:var(--slate)}
  .adj-x{width:26px;height:26px;border-radius:50%;border:0;flex:0 0 auto;cursor:pointer;
    background:rgba(12,74,110,.08);color:var(--slate);display:flex;align-items:center;justify-content:center}
  .adj-x .material-symbols-outlined{font-size:16px}

  /* aviso de lenguaje no permitido */
  .aviso-lenguaje{display:flex;align-items:center;gap:7px;background:#fef2f2;border:1px solid #fecaca;
    border-radius:14px;padding:8px 12px;font-size:11.5px;font-weight:700;color:#b91c1c}
  .aviso-lenguaje[hidden]{display:none}
  .aviso-lenguaje .material-symbols-outlined{font-size:17px;flex:0 0 auto}
  .inputbar textarea.bloqueado{border-color:#fca5a5;background:#fff1f2}
  .inputbar textarea.bloqueado:focus{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.18)}
  .hint{max-width:var(--maxw);margin:6px auto 0;font-size:10px;font-weight:600;color:#b6c2cf;
    text-align:center}
  @media (min-width:720px){ .hint{max-width:760px} }

  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
    user-select:none;
  }

  /* ---------- toast ---------- */
  #toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy-900);color:#fff;padding:10px 22px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 6px 20px rgba(12,74,110,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* destellos de pantalla completa (mismo sistema que el login) */
  .sparkles-screen{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .sparkle-layer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .sparkle{position:absolute;border-radius:50%;opacity:0;animation:sparkle-twinkle var(--dur,4s) ease-in-out var(--d,0s) infinite;will-change:opacity}
  .sparkle.c-pink{background:#F472B6;box-shadow:0 0 7px 1px rgba(244,114,182,.65)}
  .sparkle.c-gold{background:#E0A526;box-shadow:0 0 7px 1px rgba(224,165,38,.65)}
  .sparkle.c-sky{background:#38BDF8;box-shadow:0 0 7px 1px rgba(56,189,248,.65)}
  .sparkle.c-rose{background:#EC4899;box-shadow:0 0 8px 2px rgba(236,72,153,.6)}
  .sparkle.glint{width:13px;height:13px;border-radius:0;background:#EC4899;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px rgba(236,72,153,.55));--so:.85}
  .sparkle.glint.c-gold{background:#E0A526;filter:drop-shadow(0 0 4px rgba(224,165,38,.55))}
  .sparkle.glint.c-sky{background:#38BDF8;filter:drop-shadow(0 0 4px rgba(56,189,248,.55))}
  @keyframes sparkle-twinkle{0%,100%{opacity:0}50%{opacity:var(--so,.5)}}
  @media (prefers-reduced-motion: reduce){.sparkle{animation:none;opacity:.7}}
  /* marco dorado en la foto del docente */
  .avatar{filter:drop-shadow(0 8px 16px rgba(224,165,38,.45))}
  .avatar::after{border:2.5px solid rgba(224,165,38,.8)}
  .pro-av{background:linear-gradient(135deg,#f6d365,#e0a526,#b45309);filter:drop-shadow(0 8px 18px rgba(224,165,38,.4))}
  .mini-ava{box-shadow:0 0 0 2px #e0a526,0 0 8px 1px rgba(224,165,38,.5)}</style>
</head>

  /* ---------- datos reales del backend (tabla mensajes) ---------- */
  /* Abierto desde el servidor el chat se llena con lo que hay en la base;
     abierto como archivo (file:) queda la conversación de demostración. */
  var API = (location.protocol === 'file:') ? '' : ((location.port === '5500') ? 'http://127.0.0.1:8000' : location.origin);
  var real = false;          // true cuando la conversación viene de la base

  function isFile(){ return location.protocol === 'file:'; }
  function esc(t){
    return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  /* Encabezado del contacto: iniciales, brigada y si está conectado. */
  function pintarEncabezado(est){

    if (!est.enLinea){

      $('tSub').innerHTML = esc(est.brigada) + ' · <span class="offline"><i class="material-symbols-outlined" style="font-size:11px">schedule</i>Desconectado</span>';

      $('tSub').innerHTML = esc(est.brigada) + ' · <span class="online"><i></i>En línea</span>';
    }
    $('tName').textContent = est.nombre;
    return ava;
  }

  /* ---------- persistencia del chat ---------- */
  var LS = { get:function(k,d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
  var chats = LS.get('horasocial_maestro_chat_v1', {});
  var chat = chats[al.id];
  if (!chat){ chat = SEMILLAS[al.id] ? SEMILLAS[al.id].slice() : []; chats[al.id] = chat; LS.set('horasocial_maestro_chat_v1', chats); }

  pintarEncabezado(al);

  /* ---------- render ---------- */
  var msgs = $('msgs'), input = $('msjInput');
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function ahora(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function scrollBottom(){ window.scrollTo(0, document.body.scrollHeight); }

  /* Ícono según la extensión del adjunto. */
  function iconoAdj(nombre){
    var n = String(nombre || '').toLowerCase();
    if (/\.(png|jpe?g|gif|webp|bmp)$/.test(n)) return 'image';
    if (n.indexOf('.pdf') !== -1) return 'picture_as_pdf';
    if (/\.(xls|xlsx|csv)$/.test(n)) return 'table_chart';
    if (/\.(ppt|pptx)$/.test(n)) return 'slideshow';
    if (n.indexOf('.zip') !== -1) return 'folder_zip';
    if (/\.(doc|docx|txt)$/.test(n)) return 'description';
    return 'draft';
  }

  function pesoLegible(bytes){
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1).replace('.', ',') + ' MB';
    if (bytes >= 1024) return Math.round(bytes / 1024) + ' KB';
    return bytes + ' B';
  }

  /* Una burbuja: adjunto (si lo hay), texto y hora. */
  function burbuja(msg){
    var b = document.createElement('div');
    b.className = 'burbuja ' + (msg.de === 'me' ? 'me' : 'alum');
    if (msg.id != null) b.dataset.idMensaje = msg.id;
    var adj = msg.adjunto;
    if (adj){
      if (adj.es_imagen){
        var img = document.createElement('img');
        img.className = 'adj-img';
        img.src = adj.url;
        img.alt = adj.nombre;
        img.loading = 'lazy';
        img.addEventListener('click', function(){ window.open(adj.url, '_blank'); });
        b.appendChild(img);
      } else {
        var enlace = document.createElement('a');
        enlace.className = 'adj-doc';
        enlace.href = adj.url;
        enlace.target = '_blank';
        enlace.rel = 'noopener';
        var ico = document.createElement('span');
        ico.className = 'material-symbols-outlined';
        ico.textContent = iconoAdj(adj.nombre);
        var caja = document.createElement('span');
        var nombre = document.createElement('b'); nombre.textContent = adj.nombre;
        var peso = document.createElement('small'); peso.textContent = adj.tamano;
        caja.appendChild(nombre); caja.appendChild(peso);
        enlace.appendChild(ico); enlace.appendChild(caja);
        b.appendChild(enlace);
      }
    }
    if (msg.txt){ var p = document.createElement('p'); p.textContent = msg.txt; b.appendChild(p); }
    var s = document.createElement('span'); s.textContent = msg.h; b.appendChild(s);

    /* Boton eliminar: borra el mensaje PARA TODOS (docente y estudiante).
       Solo aparece con el backend real, porque necesita el id de la fila. */
    if (msg.id != null && !isFile()){
      var borrar = document.createElement('button');
      borrar.type = 'button';
      borrar.className = 'btn-del';
      borrar.setAttribute('aria-label', 'Eliminar mensaje para todos');
      borrar.title = 'Eliminar para todos';
      borrar.innerHTML = '<span class="material-symbols-outlined">delete</span>';
      borrar.addEventListener('click', function(e){
        e.stopPropagation();
        eliminarMensaje(msg.id, b);
      });
      b.appendChild(borrar);
    }
    return b;
  }

  function renderBurbujas(){
    var existentes = msgs.querySelectorAll('.burbuja');
    existentes.forEach(function(b){ b.remove(); });
    chat.forEach(function(msg){ msgs.appendChild(burbuja(msg)); });
    scrollBottom();
  }
  renderBurbujas();

  /* ---------- filtro de lenguaje (VERBATIM del chat existente) ---------- */
  var PROHIBIDAS = ['culo','culos','puta','puto','putas','putos','putita','putear','puteada','puteadas','puterio',

  var STEMS = ['bolud','pelotud','put','pendej','maricon','cabron','hijueput','porong','pajer','trol','mogol',
    'mierd','chot','conch','gil','tarad','soret','cag','estupid','imbecil','verga','polla'];
  var FRASES = ['hijo de puta','hija de puta','hijos de puta','hijas de puta','puta madre',
    'la puta madre','me cago','concha de la lora','hijo de mil'];
  /* Empiezan como una raíz pero no son ofensivas: pijama, culombio, etc.
     Se comparan exactas, así que "pijamaputa" sigue cayendo. */
  var PERMITIDAS = ['pijama','pijamas','pijao','pijaos','culombio','culombios',
    'putrefaccion','putrefacto','putrefacta','putrefactos','putrefactas',

  function normalizar(s){
    return s.toLowerCase()
      .replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e')
      .replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o')
      .replace(/[úùüû]/g,'u')
      .replace(/0/g,'o').replace(/3/g,'e').replace(/1/g,'i')
      .replace(/4/g,'a').replace(/5|7/g,'s').replace(/@/g,'a').replace(/\$/g,'s')
      .replace(/v(?![aeiou])/g,'u');
  }
  function tokenLimpio(t){
    return normalizar(t).replace(/[^a-z]/g,'');
  }
  function esProhibida(tok){
    var t = tokenLimpio(tok);
    if (!t || PERMITIDAS.indexOf(t) !== -1) return false;
    if (PROHIBIDAS.indexOf(t) !== -1) return true;
    for (var i = 0; i < STEMS.length; i++){
      if (t.indexOf(STEMS[i]) === 0) return true;
    }
    return false;
  }
  /* Devuelve las palabras y frases ofensivas encontradas. Vacío = se puede
     enviar. Es el mismo criterio que aplica el backend, que es el que manda. */
  function palabrasOfensivas(texto){
    var encontradas = [];
    var partes = String(texto).split(/\s+/);
    for (var i = 0; i < partes.length; i++){
      if (partes[i] && esProhibida(partes[i])) encontradas.push(partes[i]);
    }
    var n = ' ' + normalizar(texto).replace(/\s+/g,' ') + ' ';
    for (var j = 0; j < FRASES.length; j++){
      if (n.indexOf(FRASES[j]) !== -1 && encontradas.indexOf(FRASES[j]) === -1){
        encontradas.push(FRASES[j]);
      }
    }
    return encontradas;
  }
  function contieneProhibida(texto){
    return palabrasOfensivas(texto).length > 0;
  }
  /* ---------- bloqueo por lenguaje ----------
     Escribir algo ofensivo no se corrige solo: se marca el campo, se avisa
     en pantalla y el botón de enviar queda deshabilitado. El mensaje no sale. */
  var btnSend = $('btnSend');
  var avisoLenguaje = $('avisoLenguaje');
  var avisoTexto = $('avisoTexto');
  var bloqueado = false;
  var enviando = false;

  function refrescarBoton(){ btnSend.disabled = enviando || bloqueado; }
  function marcarBloqueo(ofensivas){
    bloqueado = true;
    input.classList.add('bloqueado');
    avisoLenguaje.hidden = false;
    avisoTexto.textContent = (ofensivas && ofensivas.length)
      ? 'No se puede enviar: escribiste "' + ofensivas.join('", "') + '". Corregilo y volvé a intentar.'
      : 'Tu mensaje tiene lenguaje no permitido. Corregilo para poder enviarlo.';
    refrescarBoton();
  }
  function limpiarBloqueo(){
    bloqueado = false;
    input.classList.remove('bloqueado');
    avisoLenguaje.hidden = true;
    refrescarBoton();
  }

  input.addEventListener('input', function(){
    if (contieneProhibida(input.value)) marcarBloqueo(palabrasOfensivas(input.value));
    else limpiarBloqueo();
    autoGrow();
  });
  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  }

  /* ---------- adjunto elegido ---------- */
  var archivoInput = $('adjArchivo');
  var adjPreview = $('adjPreview');
  var adjThumb = $('adjThumb');
  var adjNombre = $('adjNombre');
  var adjPeso = $('adjPeso');
  var adjunto = null;

  function quitarAdjunto(){
    adjunto = null;
    archivoInput.value = '';
    adjPreview.hidden = true;
    adjThumb.hidden = true;
    adjThumb.removeAttribute('src');
  }

  function mostrarAdjunto(f){
    var esImagen = (f.type || '').indexOf('image/') === 0;
    adjunto = f;
    adjNombre.textContent = f.name;
    adjPeso.textContent = pesoLegible(f.size);
    if (esImagen){
      adjThumb.src = URL.createObjectURL(f);
      adjThumb.hidden = false;
    } else {
      adjThumb.hidden = true;
      adjThumb.removeAttribute('src');
    }
    adjPreview.hidden = false;
  }

  $('btnAdj').addEventListener('click', function(){ archivoInput.click(); });
  $('adjQuitar').addEventListener('click', quitarAdjunto);

  /* ---------- selector de emojis ----------
     Emojis simples y normales (nada raro). El botón abre una grilla y cada
     emoji se inserta en la posicion del cursor. Un emoji NO es lenguaje
     ofensivo: el filtro de palabras solo mira letras, asi que conviven. */
  var EMOJIS = [
    ['Caritas', ['😀','😄','😁','😊','🙂','😉','😍','🥰','😎','🤗','😂','😅',
      '😢','😭','😔','😞','😟','😮','😱','🙄','😴','🤔','😐','😬']],
    ['Gestos', ['👍','👎','👏','🙏','🤝','✌️','👋','🤟','💪','👌','🤙','✋',
      '🖐️','👊','🤛','🤞']],
    ['Corazones', ['❤️','💙','💚','💛','💜','🧡','🤍','💖','💝','💕','💘','💗',
      '💓','💞','💟','❣️']],
    ['Colegio', ['📚','📖','✏️','📝','🎓','🏫','✅','❌','⭐','🌟','✨','🔥',
      '💡','🎯','🏆','📅','⏰','📌','📎','🔔']],
  ];

  var emojiPicker = $('emojiPicker');
  var btnEmoji = $('btnEmoji');

  function armarPicker(){
    EMOJIS.forEach(function(grupo){
      var titulo = document.createElement('div');
      titulo.className = 'emoji-titulo';
      titulo.textContent = grupo[0];
      emojiPicker.appendChild(titulo);
      grupo[1].forEach(function(carita){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = carita;
        b.setAttribute('aria-label', 'Insertar ' + carita);
        b.addEventListener('click', function(){ insertarEmoji(carita); });
        emojiPicker.appendChild(b);
      });
    });
  }

  function insertarEmoji(carita){
    var inicio = input.selectionStart != null ? input.selectionStart : input.value.length;
    var fin = input.selectionEnd != null ? input.selectionEnd : input.value.length;
    input.value = input.value.slice(0, inicio) + carita + input.value.slice(fin);
    var pos = inicio + carita.length;
    input.setSelectionRange(pos, pos);
    input.focus();
    /* Insertar un emoji puede desbloquear un aviso previo: se re-evalua. */
    if (contieneProhibida(input.value)) marcarBloqueo(palabrasOfensivas(input.value));
    else limpiarBloqueo();
    autoGrow();
  }

  function alternarPicker(mostrar){
    var abierto = (mostrar != null) ? mostrar : emojiPicker.hidden;
    emojiPicker.hidden = !abierto;
    btnEmoji.setAttribute('aria-expanded', abierto ? 'true' : 'false');
  }

  if (emojiPicker && btnEmoji){
    armarPicker();
    btnEmoji.addEventListener('click', function(e){ e.stopPropagation(); alternarPicker(); });
    document.addEventListener('click', function(e){
      if (!emojiPicker.hidden && !emojiPicker.contains(e.target) && e.target !== btnEmoji){
        alternarPicker(false);
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && !emojiPicker.hidden) alternarPicker(false);
    });
  } else if (btnEmoji){
    /* Sin panel (pagina vieja), el boton queda inofensivo. */
    btnEmoji.addEventListener('click', function(){ archivoInput.click(); });
  }

  archivoInput.addEventListener('change', function(){
    var f = archivoInput.files && archivoInput.files[0];
    if (!f){ quitarAdjunto(); return; }
    if (f.size > maxAdjuntoMB * 1048576){
      toast('El adjunto no puede pesar mas de ' + maxAdjuntoMB + ' MB');
      archivoInput.value = '';
      return;
    }
    mostrarAdjunto(f);
    input.focus();
  });

  /* ---------- enviar ---------- */
  function limpiarComposer(){
    input.value = '';
    quitarAdjunto();
    limpiarBloqueo();
    autoGrow();
  }

  function enviar(){
    if (enviando) return;
    var texto = input.value.trim();

    /* Primera barrera: el lenguaje ofensivo no sale, y queda explicado. */
    var ofensivas = palabrasOfensivas(texto);
    if (ofensivas.length){
      marcarBloqueo(ofensivas);
      toast('Mensaje bloqueado: no se envió');
      input.focus();
      return;
    }
    if (!texto && !adjunto){ toast('Escribi un mensaje o adjunta un archivo'); return; }

    if (real) enviarAlBackend(texto);
    else enviarDemo(texto, adjunto);
  }

  /* Modo servidor: el texto y el adjunto se guardan en la tabla mensajes. */
  function enviarAlBackend(texto){
    enviando = true; refrescarBoton();
    var datos = new FormData();
    datos.append('estudiante', contacto ? contacto.id : id);
    datos.append('contenido', texto);
    if (adjunto) datos.append('adjunto', adjunto);

    fetch(API + '/api/mensajes-maestro', { method:'POST', credentials:'include', body:datos })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; },
                                                  function(){ return { ok:false, d:{} }; }); })
      .then(function(res){
        if (!res.ok || !res.d.success){
          if (res.d.motivo === 'lenguaje') marcarBloqueo(res.d.palabras || []);
          toast(res.d.error || 'No se pudo enviar el mensaje');
          return;
        }
        var m = res.d.mensaje;
        chat.push({ id:m.id, de:m.de, txt:m.texto, h:m.hora, adjunto:m.adjunto });
        renderBurbujas();
        limpiarComposer();
      })
      .catch(function(){ toast('No se pudo conectar con el servidor'); })
      .then(function(){ enviando = false; refrescarBoton(); });
  }

  /* Modo demo (abierto como archivo): todo queda en el navegador. */
  function enviarDemo(texto, archivo){
    var guardado = { de:'me', txt:texto, h:ahora() };
    if (archivo){
      var esImagen = (archivo.type || '').indexOf('image/') === 0;
      guardado.adjunto = { nombre:archivo.name, tipo:(esImagen ? 'imagen' : 'archivo'),
        url:URL.createObjectURL(archivo), tamano:pesoLegible(archivo.size), es_imagen:esImagen };
    }
    chat.push(guardado);
    chats[al.id] = chat; LS.set('horasocial_maestro_chat_v1', chats);
    limpiarComposer();
    renderBurbujas();
    /* respuesta simulada del estudiante */
    var ec = document.createElement('div');
    ec.className = 'burbuja alum escrib';
    ec.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    msgs.appendChild(ec); scrollBottom();
    setTimeout(function(){
      ec.remove();
      var rta = RESPUESTAS[Math.floor(Math.random() * RESPUESTAS.length)];
      chat.push({de:'alum', txt:rta, h:ahora()});
      chats[al.id] = chat; LS.set('horasocial_maestro_chat_v1', chats);
      renderBurbujas();
    }, 1300);
  }

  $('btnSend').addEventListener('click', enviar);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
  });

  /* ---------- eliminar un mensaje para todos ----------
     Llama al backend (DELETE /api/mensaje-eliminar/<id>). El backend borra la
     fila de la tabla `mensajes` (y el adjunto del disco), así que desaparece
     tanto para el docente como para el estudiante. */
  function eliminarMensaje(idMensaje, burbujaEl){
    if (!confirm('¿Eliminar este mensaje para todos? Esta acción no se puede deshacer.')) return;
    fetch(API + '/api/mensaje-eliminar/' + idMensaje, {
      method: 'DELETE',
      credentials: 'include',
    })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; },
                                                 function(){ return { ok:false, d:{} }; }); })
      .then(function(res){
        if (!res.ok || !res.d.success){
          toast(res.d.error || 'No se pudo eliminar el mensaje');
          return;
        }
        /* Se quita del arreglo local y se repinta: el id ya no vuelve del backend. */
        chat = chat.filter(function(m){ return m.id !== idMensaje; });
        if (burbujaEl) burbujaEl.remove();
        toast('Mensaje eliminado para todos');
      })
      .catch(function(){ toast('No se pudo conectar con el servidor'); });
  }

  /* ---------- cargar la conversación real ---------- */
  function pintarConversacion(d){
    contacto = d.estudiante;
    real = true;
    if (d.limite_adjunto_mb) maxAdjuntoMB = d.limite_adjunto_mb;
    pintarEncabezado({ iniciales:d.estudiante.iniciales, brigada:d.estudiante.brigada,
      enLinea:d.estudiante.en_linea, nombre:d.estudiante.nombre });
    chat = [];
    (d.mensajes || []).forEach(function(m){
      chat.push({ id:m.id, de:m.de, txt:m.texto, h:m.hora, adjunto:m.adjunto });
    });
    renderBurbujas();
  }

  function pedirChat(estudianteId){
    return fetch(API + '/api/chat-maestro?estudiante=' + estudianteId, { credentials:'include' })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }

  function cargarChatReal(){
    var pedido = (/^\d+$/.test(id))
      ? pedirChat(id)
      : fetch(API + '/api/mensajes-maestro', { credentials:'include' })
          .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(function(d){
            var primera = (d.conversaciones || [])[0];
            if (!primera) throw new Error('bandeja vacia');
            id = String(primera.id);
            return pedirChat(id);
          });

    pedido
      .then(function(d){ if (d && d.autenticado) pintarConversacion(d); })
      .catch(function(){
        real = false;
        if (!isFile()) toast('No se pudo abrir la conversación en el servidor');
      });
  }
  if (!isFile()) cargarChatReal();
  refrescarBoton();

  /* ---------- volver a la bandeja ---------- */
  $('btnBack').addEventListener('click', function(){
    var target = (location.protocol === 'file:')
      ? '../mensajes_maestro_horasocial_pro/index.html'
      : '/profesor/mensajes';
    window.location.assign(target);
  });

  /* avatar del maestro: fallback "S" */
  var avImg = $('avImg');
  avImg.addEventListener('error', function(){
    avImg.style.display = 'none';
    var fb = $('avFb');
    if (fb) fb.style.display = 'flex';
  });
})();
</script>

<!-- destellos alrededor de toda la pantalla -->
<div class="sparkles-screen" aria-hidden="true"><div class="sparkle-layer"></div></div>
<script>
  /* destellos: misma grilla y semilla que el login */
  (function buildSparkles() {
    var layer = document.querySelector('.sparkles-screen .sparkle-layer');
    if (!layer) return;
    var COLS = 8, ROWS = 6, COUNT = COLS * ROWS;
    var STAR_CELLS = [3, 12, 21, 27, 36, 44];
    var DOTS = ['c-pink', 'c-gold', 'c-sky', 'c-rose'];
    var seed = 20261017;
    function rand() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    var cellW = 100 / COLS, cellH = 100 / ROWS;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COUNT; i++) {
      var col = i % COLS, row = Math.floor(i / COLS);
      var dot = document.createElement('span');
      var isStar = STAR_CELLS.indexOf(i) !== -1;
      var left = (col + 0.5) * cellW + (rand() - 0.5) * cellW * 0.7;
      var top = (row + 0.5) * cellH + (rand() - 0.5) * cellH * 0.7;
      dot.style.left = Math.min(97, Math.max(2, left)).toFixed(2) + '%';
      dot.style.top = Math.min(97, Math.max(2, top)).toFixed(2) + '%';
      if (isStar) {
        dot.className = 'sparkle glint ' + DOTS[Math.floor(rand() * DOTS.length)];
      } else {
        dot.className = 'sparkle ' + DOTS[Math.floor(rand() * DOTS.length)];
        var size = (3 + rand() * 4).toFixed(1);
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.setProperty('--so', (0.45 + rand() * 0.45).toFixed(2));
      }
      dot.style.setProperty('--dur', (2.5 + rand() * 2.5).toFixed(2) + 's');
      dot.style.setProperty('--d', (-rand() * 5).toFixed(2) + 's');
      frag.appendChild(dot);
    }
    layer.appendChild(frag);
  })();
</script></body>
</html>
