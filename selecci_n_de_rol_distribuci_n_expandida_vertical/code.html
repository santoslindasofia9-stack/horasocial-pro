<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
.wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
