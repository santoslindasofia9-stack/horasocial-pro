<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" href="/selecci_n_de_rol_distribuci_n_expandida_vertical/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
.wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer {
      position: relative;
      z-index: 1;
    }

    /* Golden highlight — active teacher role */
    .role-golden {
      border: 1.5px solid #D4AF37;
      background: linear-gradient(160deg, #fffdf5 0%, #fdf7e8 55%, #f8ecd0 100%);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.35), 0 4px 14px rgba(212, 175, 55, 0.18);
    }
    .role-golden .role-icon {
      background: linear-gradient(135deg, #D4AF37 0%, #E6C687 100%);
    }

    /* Disabled roles (Estudiante / Administrador): no navigation, neutral cursor */
    .role-disabled {
      cursor: default;
    }

    /* Discreet toast: small dark pill, bottom-center, fades in/out (~2.2s) */
    .flow-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 8px);
      z-index: 40;
      max-width: calc(100vw - 32px);
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
    }
    .flow-toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Decorative sparkle layer: subtle twinkling dots behind the content */
    .sparkle-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sparkle{position:absolute;border-radius:50%;opacity:0;animation:sparkle-twinkle var(--dur,4s) ease-in-out var(--d,0s) infinite;will-change:opacity}
    .sparkle.c-pink{background:#F472B6;box-shadow:0 0 7px 1px rgba(244,114,182,.65)}
    .sparkle.c-gold{background:#E0A526;box-shadow:0 0 7px 1px rgba(224,165,38,.65)}
    .sparkle.c-sky{background:#38BDF8;box-shadow:0 0 7px 1px rgba(56,189,248,.65)}
    .sparkle.c-rose{background:#EC4899;box-shadow:0 0 8px 2px rgba(236,72,153,.6)}
    .sparkle.glint{width:13px;height:13px;border-radius:0;background:#EC4899;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px rgba(236,72,153,.55));--so:.85}
    .sparkle.glint.c-gold{background:#E0A526;filter:drop-shadow(0 0 4px rgba(224,165,38,.55))}
    .sparkle.glint.c-sky{background:#38BDF8;filter:drop-shadow(0 0 4px rgba(56,189,248,.55))}
    @keyframes sparkle-twinkle{0%,100%{opacity:0}50%{opacity:var(--so,.5)}}
    @media (prefers-reduced-motion: reduce){.sparkle{animation:none;opacity:.7}}

    /* Pink pastel waves — two pink copies sit over the dominant blue field:
       1) .flow-pink-static — always-on pastel pink revealed across diagonal
          "tramos" via a static linear-gradient mask; no mouse movement needed.
       2) .flow-pink — cursor-reactive layer: radial mask follows --mx/--my
          (written by a single rAF tick), parked off-canvas until the pointer moves. */
    .flow-field.flow-pink-static {
      -webkit-mask-image: linear-gradient(115deg, transparent 2%, #000 14%, transparent 28%, #000 42%, transparent 56%, #000 70%, transparent 84%);
      mask-image: linear-gradient(115deg, transparent 2%, #000 14%, transparent 28%, #000 42%, transparent 56%, #000 70%, transparent 84%);
      -webkit-mask-clip: no-clip;
      mask-clip: no-clip;
    }
    .flow-field.flow-pink-static svg { opacity: 0.9; }
    .flow-field.flow-pink {
      -webkit-mask-image: radial-gradient(circle 340px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      mask-image: radial-gradient(circle 340px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      -webkit-mask-clip: no-clip;
      mask-clip: no-clip;
    }
    .flow-field.flow-pink svg { opacity: 1; }
    /* Pink layers render as a wider glint riding on top of the thin blue lines */
    .flow-field.flow-pink-static .wf-l, .flow-field.flow-pink .wf-l { stroke-width: 1.3; }

    /* Developer credit: discreet tracked-out line under the copyright */
    .dev-credit {
      color: rgba(170, 119, 28, 0.85);
      letter-spacing: 0.08em;
    }

    /* Golden help link: matches the teacher card / primary action gold */
    .help-gold {
      color: #AA771C;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.35);
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }
    .help-gold:hover,
    .help-gold:focus-visible {
      color: #D4AF37;
      text-shadow: 0 0 14px rgba(212, 175, 55, 0.6);
      text-decoration: underline;
    }
  </style>
</head>

<script>
// Toast helper: single reusable element, visible for ~2.2s
var toastTimer = null;
function mostrarToast(msg) {
    var t = document.getElementById('flowToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
}

// Disabled roles (Estudiante / Administrador): no navigation, discreet notice only
document.querySelectorAll('.role-disabled').forEach(function (card) {
    card.addEventListener('click', function () {
        mostrarToast('Este módulo estará disponible próximamente.');
    });
});

// Sparkle field: stratified twinkling dots covering the full viewport
// (decorative only). The viewport is divided into an even grid of cells and
// exactly one sparkle is placed per cell (centre + jitter confined to the
// cell), so the distribution never clumps and reaches top to bottom.
(function buildSparkles() {
    const layer = document.querySelector('.sparkle-layer');
    if (!layer) return;

    const COLS = 8;
    const ROWS = 6;                                  // 48 cells
    const COUNT = COLS * ROWS;
    const STAR_CELLS = [3, 12, 21, 27, 36, 44];      // six star glints, spread top-to-bottom
    const DOTS = ['c-pink', 'c-gold', 'c-sky', 'c-rose'];
    let seed = 20261017;                             // fixed seed: identical layout every load
    function rand() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

    const cellW = 100 / COLS, cellH = 100 / ROWS;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < COUNT; i++) {
        const col = i % COLS, row = Math.floor(i / COLS);
        const dot = document.createElement('span');
        const isStar = STAR_CELLS.indexOf(i) !== -1;
        const left = (col + 0.5) * cellW + (rand() - 0.5) * cellW * 0.7;
        const top  = (row + 0.5) * cellH + (rand() - 0.5) * cellH * 0.7;
        dot.style.left = Math.min(97, Math.max(2, left)).toFixed(2) + '%';
        dot.style.top  = Math.min(97, Math.max(2, top)).toFixed(2) + '%';

        if (isStar) {
            dot.className = 'sparkle glint ' + DOTS[Math.floor(rand() * DOTS.length)];
        } else {
            dot.className = 'sparkle ' + DOTS[Math.floor(rand() * DOTS.length)];
            const size = (3 + rand() * 4).toFixed(1);    // 3-7 px
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.setProperty('--so', (0.45 + rand() * 0.45).toFixed(2)); // 0.45-0.90
        }
        dot.style.setProperty('--dur', (2.5 + rand() * 2.5).toFixed(2) + 's');
        dot.style.setProperty('--d', (-rand() * 5).toFixed(2) + 's');
        frag.appendChild(dot);
    }
    layer.appendChild(frag);
})();

// Pink pastel tint: reveal the duplicate (pink) wave set near the cursor.
// --mx/--my are consumed by the CSS mask on .flow-pink; coordinates are
// relative to the .flow-field bounding rect and applied inside a single
// rAF tick, so mousemove never causes layout thrash.
(function pinkTint() {
    var field = document.querySelector('.flow-field');
    var pink = document.querySelector('.flow-pink');
    if (!field || !pink) return;

    var rect = field.getBoundingClientRect();
    var lastX = -400;
    var lastY = -400;
    var queued = false;

    function apply() {
        queued = false;
        pink.style.setProperty('--mx', lastX + 'px');
        pink.style.setProperty('--my', lastY + 'px');
    }

    document.addEventListener('mousemove', function (e) {
        // Both layers carry the same .wiggle translation, so the transformed
        // rect maps the cursor straight into the mask's local coordinate space.
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        if (!queued) {
            queued = true;
            requestAnimationFrame(apply);
        }
    }, { passive: true });

    window.addEventListener('resize', function () { rect = field.getBoundingClientRect(); });
})();
</script>
