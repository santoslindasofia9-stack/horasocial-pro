<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" href="/selecci_n_de_rol_distribuci_n_expandida_vertical/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
.wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer {
      position: relative;
      z-index: 1;
    }

    /* Golden highlight — active teacher role */
    .role-golden {
      border: 1.5px solid #D4AF37;
      background: linear-gradient(160deg, #fffdf5 0%, #fdf7e8 55%, #f8ecd0 100%);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.35), 0 4px 14px rgba(212, 175, 55, 0.18);
    }
    .role-golden .role-icon {
      background: linear-gradient(135deg, #D4AF37 0%, #E6C687 100%);
    }

    /* Disabled roles (Estudiante / Administrador): no navigation, neutral cursor */
    .role-disabled {
      cursor: default;
    }

    /* Discreet toast: small dark pill, bottom-center, fades in/out (~2.2s) */
    .flow-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 8px);
      z-index: 40;
      max-width: calc(100vw - 32px);
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
    }
    .flow-toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Decorative sparkle layer: subtle twinkling dots behind the content */
    .sparkle-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sparkle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 4px rgba(148, 178, 214, 0.45);
      /* Delay/duration/max-opacity come from per-element --d / --dur / --so */
      animation: sparkle-twinkle var(--dur, 4s) ease-in-out var(--d, 0s) infinite;
      will-change: opacity;
    }
    /* Occasional four-point star glint */
    .sparkle.glint {
      width: 9px;
      height: 9px;
      background: #ffffff;
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      --so: 0.55;
    }
    /* Literal "✨" glyph sparkles: pastel text twinkles, no dot geometry */
    .sparkle.glyph {
      border-radius: 0;
      box-shadow: none;
      line-height: 1;
      --so: 0.55;
    }
    @keyframes sparkle-twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--so, 0.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle, .sparkle.glint { animation: none; opacity: 0.35; }
    }

    /* Pink pastel waves — two pink copies sit over the dominant blue field:
       1) .flow-pink-static — always-on pastel pink revealed across diagonal
          "tramos" via a static linear-gradient mask; no mouse movement needed.
       2) .flow-pink — cursor-reactive layer: radial mask follows --mx/--my
          (written by a single rAF tick), parked off-canvas until the pointer moves. */
    .flow-field.flow-pink-static {
      -webkit-mask-image: linear-gradient(115deg, transparent 6%, #000 20%, transparent 34%, #000 48%, transparent 62%, #000 76%, transparent 90%);
      mask-image: linear-gradient(115deg, transparent 6%, #000 20%, transparent 34%, #000 48%, transparent 62%, #000 76%, transparent 90%);
      -webkit-mask-clip: no-clip;
      mask-clip: no-clip;
    }
    .flow-field.flow-pink-static svg { opacity: 0.42; }
    .flow-field.flow-pink {
      -webkit-mask-image: radial-gradient(circle 280px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      mask-image: radial-gradient(circle 280px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      -webkit-mask-clip: no-clip;
      mask-clip: no-clip;
    }
    .flow-field.flow-pink svg { opacity: 0.55; }

    /* Developer credit: discreet tracked-out line under the copyright */
    .dev-credit {
      color: rgba(170, 119, 28, 0.85);
      letter-spacing: 0.08em;
    }
  </style>
</head>

<script>
// Toast helper: single reusable element, visible for ~2.2s
var toastTimer = null;
function mostrarToast(msg) {
    var t = document.getElementById('flowToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
}

// Disabled roles (Estudiante / Administrador): no navigation, discreet notice only
document.querySelectorAll('.role-disabled').forEach(function (card) {
    card.addEventListener('click', function () {
        mostrarToast('Este módulo estará disponible próximamente.');
    });
});

// Sparkle field: stratified twinkling dots covering the full viewport
// (decorative only). The viewport is divided into an even grid of cells and
// exactly one sparkle is placed per cell (centre + jitter confined to the
// cell), so the distribution never clumps and reaches top to bottom.
(function buildSparkles() {
    var layer = document.querySelector('.sparkle-layer');
    if (!layer) return;

    var COLS = 8;             // grid columns
    var ROWS = 4;             // grid rows → 32 cells
    var COUNT = COLS * ROWS;  // 32 elements: 28 dots + 4 "✨" glyphs
    var GLYPH_CELLS = [5, 14, 22, 30]; // cells holding a "✨" glyph
    var GLINT_EVERY = 7;      // every 7th non-glyph cell is a star glint (~5)
    var seed = 20261017;      // fixed seed: identical layout on every load

    function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
    }

    // Dot palette, target weights: white 35%, pastel pink 25%, gold 20%, sky 20%
    function pickColor(r) {
        if (r < 0.35) return '#ffffff';
        if (r < 0.60) return '#FFD1DC';
        if (r < 0.80) return '#E6C687';
        return '#cde9ff';
    }
    // Glyph palettes stay pastel (never pure white, it would vanish on white)
    function pickGlyphColor(r) {
        if (r < 0.40) return '#FFD1DC';
        if (r < 0.75) return '#E6C687';
        return '#cde9ff';
    }

    var cellW = 100 / COLS;
    var cellH = 100 / ROWS;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COUNT; i++) {
        var col = i % COLS;
        var row = Math.floor(i / COLS);
        var dot = document.createElement('span');
        var isGlyph = GLYPH_CELLS.indexOf(i) !== -1;
        var isGlint = !isGlyph && (i % GLINT_EVERY) === 3;
        dot.className = isGlyph ? 'sparkle glyph' : (isGlint ? 'sparkle glint' : 'sparkle');

        // Stratified placement: cell centre + jitter that stays inside the cell
        var left = (col + 0.5) * cellW + (rand() - 0.5) * cellW * 0.7;
        var top = (row + 0.5) * cellH + (rand() - 0.5) * cellH * 0.7;
        dot.style.left = Math.min(97, Math.max(2, left)).toFixed(2) + '%';
        dot.style.top = Math.min(97, Math.max(2, top)).toFixed(2) + '%';

        if (isGlyph) {
            dot.textContent = '✨';
            dot.style.fontSize = (10 + rand() * 4).toFixed(1) + 'px'; // 10–14px
            dot.style.color = pickGlyphColor(rand());
            dot.style.setProperty('--so', (0.45 + rand() * 0.1).toFixed(2)); // capped at 0.55
        } else if (isGlint) {
            dot.style.setProperty('--so', '0.55');
        } else {
            var size = (2 + rand() * 3).toFixed(1); // 2–5 px
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.background = pickColor(rand());
            dot.style.setProperty('--so', (0.25 + rand() * 0.3).toFixed(2)); // capped at 0.55
        }
        dot.style.setProperty('--dur', (3.5 + rand() * 3).toFixed(2) + 's');
        dot.style.setProperty('--d', (-rand() * 6).toFixed(2) + 's');
        frag.appendChild(dot);
    }
    layer.appendChild(frag);
})();

// Pink pastel tint: reveal the duplicate (pink) wave set near the cursor.
// --mx/--my are consumed by the CSS mask on .flow-pink; coordinates are
// relative to the .flow-field bounding rect and applied inside a single
// rAF tick, so mousemove never causes layout thrash.
(function pinkTint() {
    var field = document.querySelector('.flow-field');
    var pink = document.querySelector('.flow-pink');
    if (!field || !pink) return;

    var rect = field.getBoundingClientRect();
    var lastX = -400;
    var lastY = -400;
    var queued = false;

    function apply() {
        queued = false;
        pink.style.setProperty('--mx', lastX + 'px');
        pink.style.setProperty('--my', lastY + 'px');
    }

    document.addEventListener('mousemove', function (e) {
        // Both layers carry the same .wiggle translation, so the transformed
        // rect maps the cursor straight into the mask's local coordinate space.
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        if (!queued) {
            queued = true;
            requestAnimationFrame(apply);
        }
    }, { passive: true });

    window.addEventListener('resize', function () { rect = field.getBoundingClientRect(); });
})();
</script>
