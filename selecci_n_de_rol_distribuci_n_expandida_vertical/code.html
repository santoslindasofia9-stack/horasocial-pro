<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" href="/selecci_n_de_rol_distribuci_n_expandida_vertical/style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
.wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer {
      position: relative;
      z-index: 1;
    }

    /* Golden highlight — active teacher role */
    .role-golden {
      border: 1.5px solid #D4AF37;
      background: linear-gradient(160deg, #fffdf5 0%, #fdf7e8 55%, #f8ecd0 100%);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.35), 0 4px 14px rgba(212, 175, 55, 0.18);
    }
    .role-golden .role-icon {
      background: linear-gradient(135deg, #D4AF37 0%, #E6C687 100%);
    }

    /* Disabled roles (Estudiante / Administrador): no navigation, neutral cursor */
    .role-disabled {
      cursor: default;
    }

    /* Discreet toast: small dark pill, bottom-center, fades in/out (~2.2s) */
    .flow-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 8px);
      z-index: 40;
      max-width: calc(100vw - 32px);
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
    }
    .flow-toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* Decorative sparkle layer: subtle twinkling dots behind the content */
    .sparkle-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sparkle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 4px rgba(148, 178, 214, 0.45);
      animation: sparkle-twinkle 4s ease-in-out infinite;
      will-change: opacity;
    }
    /* Occasional four-point star glint */
    .sparkle.glint {
      width: 9px;
      height: 9px;
      background: #ffffff;
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      --so: 0.7;
    }
    @keyframes sparkle-twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--so, 0.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle, .sparkle.glint { animation: none; opacity: 0.35; }
    }

    /* Pink pastel interactive tint: duplicate wave set revealed near the cursor.
       Mask coordinates come from --mx/--my (relative to this layer's own box). */
    .flow-field.flow-pink {
      -webkit-mask-image: radial-gradient(circle 260px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      mask-image: radial-gradient(circle 260px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
      -webkit-mask-clip: no-clip;
      mask-clip: no-clip;
    }
    .flow-field.flow-pink svg { opacity: 0.45; }
  </style>
</head>

<script>
// Toast helper: single reusable element, visible for ~2.2s
var toastTimer = null;
function mostrarToast(msg) {
    var t = document.getElementById('flowToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
}

// Disabled roles (Estudiante / Administrador): no navigation, discreet notice only
document.querySelectorAll('.role-disabled').forEach(function (card) {
    card.addEventListener('click', function () {
        mostrarToast('Este módulo estará disponible próximamente.');
    });
});

// Sparkle field: subtle twinkling dots across the screen (decorative only)
(function buildSparkles() {
    var layer = document.querySelector('.sparkle-layer');
    if (!layer) return;

    var COUNT = 20;       // total sparkles
    var GLINT_EVERY = 7;  // every 7th sparkle is a four-point star glint (~3 total)
    var palette = ['#ffffff', '#f6e7bd', '#cfe8ff']; // white / soft gold / soft blue
    var seed = 20261017;  // fixed seed: identical layout on every load

    function rand() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
    }

    var frag = document.createDocumentFragment();
    for (var i = 0; i < COUNT; i++) {
        var dot = document.createElement('span');
        var isGlint = (i % GLINT_EVERY) === 3;
        dot.className = isGlint ? 'sparkle glint' : 'sparkle';
        dot.style.left = (4 + rand() * 92).toFixed(2) + '%';
        dot.style.top = (3 + rand() * 94).toFixed(2) + '%';
        if (!isGlint) {
            var size = (2 + rand() * 3).toFixed(1); // 2–5 px
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.background = palette[Math.floor(rand() * palette.length)];
            dot.style.setProperty('--so', (0.35 + rand() * 0.4).toFixed(2));
        }
        dot.style.animationDuration = (3.5 + rand() * 3).toFixed(2) + 's';
        dot.style.animationDelay = (-rand() * 6).toFixed(2) + 's';
        frag.appendChild(dot);
    }
    layer.appendChild(frag);
})();

// Pink pastel tint: reveal the duplicate (pink) wave set near the cursor.
// --mx/--my are consumed by the CSS mask on .flow-pink; coordinates are
// relative to the .flow-field bounding rect and applied inside a single
// rAF tick, so mousemove never causes layout thrash.
(function pinkTint() {
    var field = document.querySelector('.flow-field');
    var pink = document.querySelector('.flow-pink');
    if (!field || !pink) return;

    var rect = field.getBoundingClientRect();
    var lastX = -400;
    var lastY = -400;
    var queued = false;

    function apply() {
        queued = false;
        pink.style.setProperty('--mx', lastX + 'px');
        pink.style.setProperty('--my', lastY + 'px');
    }

    document.addEventListener('mousemove', function (e) {
        // Both layers carry the same .wiggle translation, so the transformed
        // rect maps the cursor straight into the mask's local coordinate space.
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        if (!queued) {
            queued = true;
            requestAnimationFrame(apply);
        }
    }, { passive: true });

    window.addEventListener('resize', function () { rect = field.getBoundingClientRect(); });
})();
</script>
