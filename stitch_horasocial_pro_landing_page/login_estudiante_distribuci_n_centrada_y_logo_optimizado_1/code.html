<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background relative overflow-hidden">
<!-- Subtle Background Blobs -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-celeste/20 rounded-full bg-blob"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-pastel-pink/30 rounded-full bg-blob"></div>
<div class="fixed top-[20%] right-[10%] w-[30%] h-[30%] bg-surface-container-low rounded-full bg-blob"></div>
<!-- Main Content Shell -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-gutter z-10 h-screen">
<div class="glass-card w-full max-w-[440px] rounded-2xl shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-white/50 p-lg md:p-xl relative overflow-hidden">
<!-- Subtle Watermark -->
<div class="absolute bottom-4 right-4 w-12 h-12 gear-watermark text-on-surface-variant/5"></div>
<!-- Header Section -->
<div class="flex flex-col items-center text-center mb-xl">
<img alt="Horasocial Pro Institutional Logo" class="w-auto mb-md object-contain h-32" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzHA6ZFqv_buT-Csu67WWFljjcjW2NHuCSy1BNOBjlKQVYmjFtOw3o8IQp77Y9ebhDaYwd5Jts5558Gq8-_folCkqms8wl-UDzZrz_D8smG3SmJguL8vHkFBcQCcz2chNlThAD5Z8CiapgKMmtG1UaL1I_LMLPziHj8J_NLY-V9vU2DU68CYAIhWptZXRGNc-J_W3oQlzpxWSiKGrP3Rn1w87UU5VQktTkj_DSWCiQn6WPFDSpojOe6JbltDVXSjUPC0IXy-ssM2-d"/>
<h1 class="font-headline-md text-headline-md text-on-surface">
                    Iniciar Sesión: <span class="text-celeste">Estudiante</span>
</h1>
</div>
<!-- Login Form -->
<form class="space-y-xl">
<!-- User Field -->
<div class="space-y-xs">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-celeste transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-md pl-[48px] pr-md font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:border-celeste outline-none transition-all" placeholder="C3digo o correo electr3nico" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-celeste transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-md pl-[48px] pr-xl font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:border-celeste outline-none transition-all" id="passwordInput" placeholder="Contrase&amp;ntilde;a" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-celeste transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md tracking-wide py-md rounded-lg shadow-sm hover:shadow-md hover:bg-primary transition-all duration-200 transform active:scale-[0.98]" type="submit">
                    INGRESAR
                </button>
<!-- Forgot Password Link -->
<div class="text-center">
<a class="text-celeste font-label-md text-label-sm hover:underline underline-offset-4 transition-all" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full py-lg px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md z-10 bg-transparent">
<span class="font-label-sm text-label-sm text-on-surface-variant">
            © 2024 Horasocial Pro. Professional Social Service Management.
        </span>
<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacidad</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Soporte</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Términos</a>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple subtle parallax for background blobs
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const blobs = document.querySelectorAll('.bg-blob');
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
