<!DOCTYPE html><html class="light" lang="es"><head>

            "gutter": "24px",
            "sm": "8px",
            "xl": "32px"

          "fontFamily": {

            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "label-sm": ["Inter"],
            "headline-md": ["Plus Jakarta Sans"],

            "display-lg": ["Plus Jakarta Sans"],
            "body-lg": ["Inter"],

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .blur-blob {
      filter: blur(100px);
      z-index: -1;
    }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-x-hidden min-h-screen relative">
<!-- Dynamic Background Blurs -->
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#FDFBF7] via-[#F7F9FB] to-[#E0F2FE]">
<!-- Light blue top-left blob -->
<div class="absolute top-[-5%] left-[-5%] w-[60%] h-[60%] rounded-full bg-bright-sky/15 blur-blob"></div>
<!-- Faint pastel pink bottom-right blob -->
<div class="absolute bottom-[-5%] right-[-5%] w-[50%] h-[50%] rounded-full bg-pink-200/10 blur-blob"></div>
</div>
<header class="w-full flex flex-col items-center pt-xl px-margin-mobile">
<div class="mb-md">
<img alt="HORASOCIAL PRO Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDn6wSCAWBO1lLcTZwyC91akbXatP02yC33rdoGf_zObBHmoNVbmw6LiaEC-99OsUFhQ2mUSQkXI6VOhV4vMGeJPCbvysq_SQaNX4sSOfi50e953dx6wjH1D2eZ_sTO1mdW9TxLxNTUll7NvbVQ9VDd2H1TPLR-DmucvfaIm5hVcZjze4BGdiZXS3yB0mt9eRk1LHzBBL1EppF1AhLXlvTes6pWqhCTmS0LrIa93nJUgsCOG5O3jPdbYCFJJ-jtcJcS8HUAc5auNcvO">
</div>
<div class="text-center">
<p class="font-headline-sm text-headline-sm flex flex-col items-center gap-1">
<span class="text-institutional-blue font-bold">Formando líderes.</span>
<span class="text-bright-sky font-bold">Trackeando tu impacto.</span>
</p>
</div>
</header>
<main class="flex flex-col items-center px-margin-mobile py-xl space-y-md">
<!-- Role Selection Symmetrical Vertical Stack -->
<div class="w-full max-w-sm space-y-md">
<!-- Card 1: Estudiante -->
<button class="group relative w-full bg-white/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 active:scale-95 hover:-translate-y-1 hover:shadow-lg hover:border-bright-sky/30 flex flex-col items-center text-center overflow-hidden">
<div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center mb-md transition-colors duration-300 group-hover:bg-bright-sky group-active:bg-bright-sky">
<span class="material-symbols-outlined text-bright-sky text-3xl transition-colors duration-300 group-hover:text-white group-active:text-white" data-icon="school">school</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-[#45464D] font-bold">Estudiante</h3>
<p class="mt-xs font-label-md text-label-md text-outline">Registra tus horas y gestiona proyectos sociales.</p>
</button>
<!-- Card 2: Profesor -->
<button class="group relative w-full bg-white/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 active:scale-95 hover:-translate-y-1 hover:shadow-lg hover:border-institutional-blue flex flex-col items-center text-center overflow-hidden">
<div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-md transition-all duration-300 group-hover:bg-institutional-blue group-active:bg-institutional-blue">
<span class="material-symbols-outlined text-gray-500 text-3xl transition-colors duration-300 group-hover:text-white group-active:text-white" data-icon="group">group</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface font-bold">Profesor</h3>
<p class="mt-xs font-label-md text-label-md text-outline">Supervisa el avance de tus estudiantes y aprueba horas.</p>
</button>
<!-- Card 3: Administrador -->
<button class="group relative w-full bg-white/60 backdrop-blur-md rounded-2xl p-xl shadow-sm border border-transparent transition-all duration-300 active:scale-95 hover:-translate-y-1 hover:shadow-lg hover:border-institutional-blue/80 flex flex-col items-center text-center overflow-hidden">
<div class="w-16 h-16 rounded-full bg-gray-800 flex items-center justify-center mb-md transition-all duration-300">
<span class="material-symbols-outlined text-white text-3xl" data-icon="shield_person">shield_person</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface font-bold">Administrador</h3>
<p class="mt-xs font-label-md text-label-md text-outline">Gestiona instituciones, programas y reportes globales.</p>
</button>
</div>
<!-- Help text -->
<div class="mt-lg text-center">
<p class="font-label-md text-label-md text-outline">
        ¿Necesitas ayuda? <a class="text-secondary font-semibold hover:underline" href="#">Consulta nuestra guía de acceso</a>
</p>
</div>
</main>
<footer class="w-full px-margin-mobile py-lg text-center mt-auto">
<div class="mb-sm">
<span class="font-label-md text-label-md font-bold text-on-surface">HORASOCIAL PRO</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 HORASOCIAL PRO: Gestión de Servicio Social Escolar</p>
</div>
<nav class="flex justify-center gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Términos</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Privacidad</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary" href="#">Contacto</a>
</nav>
</footer>
</body></html>
