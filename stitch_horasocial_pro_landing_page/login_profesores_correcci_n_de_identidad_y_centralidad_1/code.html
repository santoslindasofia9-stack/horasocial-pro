</header>

<form class="w-full space-y-md" onsubmit="return false">

<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="person">person</span>
<input class="w-full h-12 pl-xl pr-md bg-white border border-outline-variant rounded-lg font-body-md text-body-md placeholder:text-outline focus:outline-none focus:border-[#0f172a] focus:ring-2 focus:ring-[#0f172a]/10 transition-all duration-200" placeholder="Correo electrónico o usuario" type="text">
</div>

<div class="relative group">

<input class="w-full h-12 pl-xl pr-xl bg-white border border-outline-variant rounded-lg font-body-md text-body-md placeholder:text-outline focus:outline-none focus:border-[#0f172a] focus:ring-2 focus:ring-[#0f172a]/10 transition-all duration-200" id="password-field" placeholder="Contraseña" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<!-- Primary Button -->
<button class="w-full h-12 mt-lg bg-[#0f172a] text-white font-label-md text-label-md tracking-wider rounded-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">

</button>

</div>

</div>
</main>

<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contacto</a>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-field');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }
    </script>
