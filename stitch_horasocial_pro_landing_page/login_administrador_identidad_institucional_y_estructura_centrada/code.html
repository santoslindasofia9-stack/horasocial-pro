<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(57, 184, 253, 0.15) 0%, rgba(255, 182, 193, 0.1) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
        }

        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; background: linear-gradient(135deg, rgba(255, 182, 193, 0.15) 0%, rgba(57, 184, 253, 0.1) 100%); }

        .material-symbols-outlined {

        }

            border-color: #0f172a;

<body class="bg-background text-on-background min-h-screen relative flex flex-col font-body-md text-body-md h-screen">
<!-- Background Blobs -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<!-- Main Content Container -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="glass-card w-full max-w-[420px] p-xl rounded-2xl shadow-[0_4px_20px_rgba(15,23,42,0.05)] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-xl w-full flex justify-center">
<img alt="Horasocial Pro Logo" class="h-32 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCE2DWhQXGvcIub4O5oDs4Tz540xFOzG_WblWlKC68zKD90YLLTtQ_vgHAjxL63Q2DAqQg8hU3GB9dbc4aZtVq-qdmC7AuDYHjaM0NcPrJsK91wcpZ53Vq4w-qVE0I_1MNJpJHFvFLOcCvPK7sfuMpp-DUZuoRX6bAdSoeIC9yaugrdm070zqD3znpUWy3CsQHnxEUCLhdhbugXenTrckGtOrsmq_8sTii-hG0nsPaFlclnT-kepJ3b1FCkzsAEStJyaz-RGaOfqmZa">
</div>
<!-- Header Section -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-md text-headline-md text-on-surface">
                    Iniciar Sesión: <span class="text-brand-navy">Administrador</span>
</h1>
<p class="font-label-sm text-label-sm text-outline mt-xs">Gestión de Servicio Social Escolar</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-md" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="relative flex items-center border border-outline-variant rounded-lg bg-white/50 transition-all duration-200 input-focus-ring">
<span class="material-symbols-outlined ml-md text-outline" data-icon="person">person</span>
<input class="w-full bg-transparent border-none py-md px-md focus:ring-0 placeholder:text-outline/60 text-on-surface font-label-md" placeholder="Usuario o correo de administrador" required="" type="text">
</div>
<!-- Password Input -->
<div class="relative flex items-center border border-outline-variant rounded-lg bg-white/50 transition-all duration-200 input-focus-ring">
<span class="material-symbols-outlined ml-md text-outline" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none py-md px-md focus:ring-0 placeholder:text-outline/60 text-on-surface font-label-md" id="password-input" placeholder="Contraseña" required="" type="password">
<button class="mr-md text-outline hover:text-brand-navy transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
<!-- Submit Button -->
<button class="w-full bg-brand-navy text-white font-label-md py-md rounded-lg shadow-md hover:bg-brand-navy/90 active:scale-[0.98] transition-all uppercase tracking-wider mt-xl" type="submit">
                    INGRESAR
                </button>
<!-- Forgot Password -->
<div class="text-center mt-lg">
<a class="text-secondary hover:underline font-label-sm transition-all duration-200" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
</div>
</form>
</div>
</main>
<!-- Footer Component -->
<footer class="w-full flex flex-col md:flex-row justify-between items-center px-margin-desktop py-lg bg-transparent font-label-sm text-label-sm text-on-surface-variant mt-auto">
<div class="mb-sm md:mb-0">

        </div>
<div class="flex gap-xl">
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Privacidad</a>
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Soporte</a>
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Términos</a>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
