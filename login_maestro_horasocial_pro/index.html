<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HORASOCIAL PRO - Acceso Profesores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --institutional: #0F172A;
      --sky: #38BDF8;
      --sky-dark: #0EA5E9;
      --surface: #FFFFFF;
      --muted: #45464D;
      --muted-soft: #6B7280;
      --line: #D1D7E2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      color: var(--institutional);
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    /* Background wave field — same as welcome / role selection */
    .flow-field {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 40%;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .flow-field svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .wf-l {
      fill: none;
      stroke-width: 0.9;
      vector-effect: non-scaling-stroke;
    }
    .wiggle {
      animation: flow-drift 38s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes flow-drift {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, -16px); }
      45% { transform: translate(19px, -6px); }
      70% { transform: translate(11px, 6px); }
    }
    header, main, footer { position: relative; z-index: 1; }

    /* Header */
    .site-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
    }
    .site-header .logo {
      height: 160px;
      width: auto;
      object-fit: contain;
      border: 1.5px solid rgba(15, 23, 42, 0.75);
      border-radius: 14px;
      padding: 8px;
      background: #fff;
      margin-bottom: 24px;
    }
    .slogan {
      text-align: center;
      padding: 0 16px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slogan .line-1 { color: var(--institutional); }
    .slogan .line-2 { color: var(--sky); }

    /* Login card */
    .login-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid rgba(209, 215, 226, 0.9);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 32px;
      text-align: center;
    }
    .login-card h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--institutional);
      margin-bottom: 24px;
    }
    .login-card h1 .rol {
      color: var(--sky);
    }
    .field {
      margin-bottom: 20px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--muted-soft);
      font-size: 20px;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 46px;
      font-size: 15px;
      font-family: "Inter", sans-serif;
      color: var(--institutional);
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .input-wrap input::placeholder { color: rgba(107, 114, 128, 0.7); }
    .input-wrap input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    .input-wrap .eye {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-soft);
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .input-wrap .eye:hover { color: var(--sky); }
    .btn-ingresar {
      width: 100%;
      padding: 14px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #D4AF37, #F3E5AB, #AA771C);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(170, 119, 28, 0.55);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
      text-shadow: 0 1px 2px rgba(122, 84, 6, 0.55);
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease, filter .2s ease;
    }
    .btn-ingresar:hover {
      background: linear-gradient(135deg, #D4AF37, #F3E5AB, #AA771C);
      filter: brightness(1.05);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.55);
    }
    .btn-ingresar:active { transform: scale(0.98); }
    .forgot {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--sky);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }
    .login-error {
      margin-bottom: 20px;
      padding: 10px 14px;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      text-align: left;
      color: #B42318;
      background: #FEF3F2;
      border: 1px solid #FDA29B;
      border-radius: 10px;
    }
    .login-error[hidden] { display: none; }

    /* Footer */
    .site-footer {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .site-footer .copy {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-soft);
    }
    .site-footer nav { display: flex; gap: 20px; }
    .site-footer nav a {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-soft);
      text-decoration: none;
    }
    .site-footer nav a:hover { color: var(--sky); }

    @media (max-width: 640px) {
      .site-header { padding-top: 20px; }
      .site-header .logo { height: 120px; }
      .login-card { padding: 24px 18px; }
      .site-footer { justify-content: center; }
    }

    /* ---- decorative layers ported from welcome / role selection ---- */
    /* Decorative sparkle layer: subtle twinkling dots behind the content */
        .sparkle-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .sparkle{position:absolute;border-radius:50%;opacity:0;animation:sparkle-twinkle var(--dur,4s) ease-in-out var(--d,0s) infinite;will-change:opacity}
        .sparkle.c-pink{background:#F472B6;box-shadow:0 0 7px 1px rgba(244,114,182,.65)}
        .sparkle.c-gold{background:#E0A526;box-shadow:0 0 7px 1px rgba(224,165,38,.65)}
        .sparkle.c-sky{background:#38BDF8;box-shadow:0 0 7px 1px rgba(56,189,248,.65)}
        .sparkle.c-rose{background:#EC4899;box-shadow:0 0 8px 2px rgba(236,72,153,.6)}
        .sparkle.glint{width:13px;height:13px;border-radius:0;background:#EC4899;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px rgba(236,72,153,.55));--so:.85}
        .sparkle.glint.c-gold{background:#E0A526;filter:drop-shadow(0 0 4px rgba(224,165,38,.55))}
        .sparkle.glint.c-sky{background:#38BDF8;filter:drop-shadow(0 0 4px rgba(56,189,248,.55))}
        @keyframes sparkle-twinkle{0%,100%{opacity:0}50%{opacity:var(--so,.5)}}
        @media (prefers-reduced-motion: reduce){.sparkle{animation:none;opacity:.7}}

    /* Pink pastel waves — two pink copies sit over the dominant blue field:
           1) .flow-pink-static — always-on pastel pink revealed across diagonal
              "tramos" via a static linear-gradient mask; no mouse movement needed.
           2) .flow-pink — cursor-reactive layer: radial mask follows --mx/--my
              (written by a single rAF tick), parked off-canvas until the pointer moves. */
        .flow-field.flow-pink-static {
            -webkit-mask-image: linear-gradient(115deg, transparent 2%, #000 14%, transparent 28%, #000 42%, transparent 56%, #000 70%, transparent 84%);
            mask-image: linear-gradient(115deg, transparent 2%, #000 14%, transparent 28%, #000 42%, transparent 56%, #000 70%, transparent 84%);
            -webkit-mask-clip: no-clip;
            mask-clip: no-clip;
        }
        .flow-field.flow-pink-static svg { opacity: 0.9; }
        .flow-field.flow-pink {
            -webkit-mask-image: radial-gradient(circle 340px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
            mask-image: radial-gradient(circle 340px at var(--mx, -400px) var(--my, -400px), #000 0%, transparent 70%);
            -webkit-mask-clip: no-clip;
            mask-clip: no-clip;
        }
        .flow-field.flow-pink svg { opacity: 1; }
        /* Pink layers render as a wider glint riding on top of the thin blue lines */
        .flow-field.flow-pink-static .wf-l, .flow-field.flow-pink .wf-l { stroke-width: 1.3; }

    /* ---- link color aligned with the teacher pages ---- */
    /* Help link uses the same gold as the rest of the teacher pages */
    .forgot { color: #AA771C; }
    .forgot:hover { color: #D4AF37; }
</style>
</head>

<script>
function togglePassword() {

if (location.protocol === 'file:') {

// El backend devuelve aqui con ?error=<codigo> cuando el intento falla o la
// sesion no llego a abrirse. Asi el aviso aparece en ESTE formulario en vez de
// aterrizar en las pantallas planas de Django, que ofrecen "olvide mi
// contrasena" y confunden al docente.
(function mostrarErrorDeLogin() {
  const MOTIVOS = {
    credenciales: 'Código o correo y contraseña incorrectos. Verifica tus datos e inténtalo de nuevo.',
    sesion: 'Tu sesión no está activa. Ingresa de nuevo para continuar.'
  };

  const codigo = new URLSearchParams(location.search).get('error');
  if (!codigo || !MOTIVOS[codigo]) return;

  const caja = document.getElementById('loginError');
  caja.textContent = MOTIVOS[codigo];
  caja.hidden = false;

  // Se limpia el parametro para que una recarga no repita el aviso.
  if (location.protocol !== 'file:') {
    history.replaceState(null, '', location.pathname);
  }

  document.getElementById('username').focus();
})();

    // Sparkle field: stratified twinkling dots covering the full viewport
        // (decorative only). The viewport is divided into an even grid of cells and
        // exactly one sparkle is placed per cell (centre + jitter confined to the
        // cell), so the distribution never clumps and reaches top to bottom.
        (function buildSparkles() {
            const layer = document.querySelector('.sparkle-layer');
            if (!layer) return;

            const COLS = 8;
            const ROWS = 6;                                  // 48 cells
            const COUNT = COLS * ROWS;
            const STAR_CELLS = [3, 12, 21, 27, 36, 44];      // six star glints, spread top-to-bottom
            const DOTS = ['c-pink', 'c-gold', 'c-sky', 'c-rose'];
            let seed = 20261017;                             // fixed seed: identical layout every load
            function rand() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

            const cellW = 100 / COLS, cellH = 100 / ROWS;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < COUNT; i++) {
                const col = i % COLS, row = Math.floor(i / COLS);
                const dot = document.createElement('span');
                const isStar = STAR_CELLS.indexOf(i) !== -1;
                const left = (col + 0.5) * cellW + (rand() - 0.5) * cellW * 0.7;
                const top  = (row + 0.5) * cellH + (rand() - 0.5) * cellH * 0.7;
                dot.style.left = Math.min(97, Math.max(2, left)).toFixed(2) + '%';
                dot.style.top  = Math.min(97, Math.max(2, top)).toFixed(2) + '%';

                if (isStar) {
                    dot.className = 'sparkle glint ' + DOTS[Math.floor(rand() * DOTS.length)];
                } else {
                    dot.className = 'sparkle ' + DOTS[Math.floor(rand() * DOTS.length)];
                    const size = (3 + rand() * 4).toFixed(1);    // 3-7 px
                    dot.style.width = size + 'px';
                    dot.style.height = size + 'px';
                    dot.style.setProperty('--so', (0.45 + rand() * 0.45).toFixed(2)); // 0.45-0.90
                }
                dot.style.setProperty('--dur', (2.5 + rand() * 2.5).toFixed(2) + 's');
                dot.style.setProperty('--d', (-rand() * 5).toFixed(2) + 's');
                frag.appendChild(dot);
            }
            layer.appendChild(frag);
        })();

        // Pink pastel tint// Pink pastel tint: reveal the duplicate (pink) wave set near the cursor.
        // --mx/--my are consumed by the CSS mask on .flow-pink; coordinates are
        // relative to the .flow-field bounding rect and applied inside a single
        // rAF tick, so mousemove never causes layout thrash.
        (function pinkTint() {
            const field = document.querySelector('.flow-field');
            const pink = document.querySelector('.flow-pink');
            if (!field || !pink) return;

            let rect = field.getBoundingClientRect();
            let lastX = -400;
            let lastY = -400;
            let queued = false;

            function apply() {
                queued = false;
                pink.style.setProperty('--mx', lastX + 'px');
                pink.style.setProperty('--my', lastY + 'px');
            }

            document.addEventListener('mousemove', (e) => {
                // Both layers carry the same .wiggle translation, so the transformed
                // rect maps the cursor straight into the mask's local coordinate space.
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
                if (!queued) {
                    queued = true;
                    requestAnimationFrame(apply);
                }
            }, { passive: true });

            window.addEventListener('resize', () => { rect = field.getBoundingClientRect(); });
        })();
</script>
